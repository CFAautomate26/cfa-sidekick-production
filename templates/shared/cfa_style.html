{# Team Hub's one look (chick-fil-a.ca tokens), shared by the leader pages
   (/shift) and Systems & Procedures (/hub). Page-specific styles live in
   each page's head block. Light only, like chick-fil-a.ca. #}
<style>
:root {
  color-scheme: light;
  /* Brand reds (chick-fil-a.ca tokens) */
  --red-600: #DD0031;  --red-700: #AF272F;
  --red-050: #FFF8F7;  --red-100: #FEEEEB;  --red-200: #FBE0DB;
  --red-grad: linear-gradient(180deg, #FF033B 0%, #CA0F1A 100%);
  --red-grad-pressed: linear-gradient(180deg, #BF032D 0%, #980B14 100%);
  /* Navy + supporting brand colours */
  --navy-800: #004F71;  --navy-ink: #1F4F6E;  --cool-white: #F4F8F9;  --navy-100: #E3EEF2;
  --tan-050: #FCF9F4;  --tan-100: #FAF2E7;  --tan-300: #F5E3CC;  --tan-400: #DBC8B0;  --tan-ink: #6B4B12;
  --teal: #3EB1C8;  --gold: #BD983F;  --yellow: #F5E1A4;
  --green-800: #00635B;  --green-100: #C5EFDE;
  /* Grays */
  --gray-050: #F7F7F7; --gray-100: #F0F1F2; --gray-300: #DBE0E2; --gray-400: #CCCCCC;
  --gray-600: #67737C; --gray-700: #5B6770; --gray-800: #485259; --gray-900: #3B4449; --black-c: #2D2926;

  /* Roles: red = brand, headline, action · navy = a place you can go · gray = information */
  --bg: #FFFFFF;            --bg-tile: var(--tan-100);
  --text: var(--gray-800);  --text-muted: var(--gray-600);  --text-strong: var(--gray-900);
  --accent: var(--red-600); --accent-hover: var(--red-700);
  --nav: var(--navy-ink);   --info: var(--navy-800);
  --rule: var(--gray-300);  --rule-strong: var(--gray-400);
  --ok: var(--green-800);   --ok-bg: var(--green-100);

  /* Type: licensed faces named first, never loaded; system sans fallbacks only (no serif) */
  --font-sans: "Apercu", "Apercu Pro", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-display: "Gooper Condensed", var(--font-sans);
  --fs-xs: 0.75rem;       /* 12 badges, fine print */
  --fs-small: 0.875rem;   /* 14 meta */
  --fs-body: 1rem;        /* 16 */
  --fs-lede: 1.125rem;    /* 18 */
  --fs-h3: 1.0625rem;     /* 17 row titles */
  --fs-h2: 1.375rem;      /* 22 section heads (heading-xs) */
  --fs-h1: clamp(2rem, 8.2vw, 2.75rem);      /* 32–44 red headline (landing, sign-in) */
  --fs-h1-compact: clamp(1.75rem, 7.2vw, 2.25rem); /* 28–36 working pages */
  --fs-menu: 1.75rem;     /* 28 menu words */
  --track-tight: -0.03em; --track-body: -0.01em; --track-eyebrow: 0.1em;

  /* Shape + depth */
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-2xl: 16px; --r-3xl: 24px; --r-full: 9999px;
  --shadow: 0 0 .375rem rgba(0,0,0,.2);
  --gutter: 16px;
  --content: 640px;       /* phone/tablet column */
  --content-wide: 1120px; /* office desktop */
  --masthead-h: 104px;
  --tabbar-h: 60px;
  --focus: 0 0 0 3px rgba(0,79,113,.28);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans); font-size: var(--fs-body); line-height: 1.375;
  letter-spacing: var(--track-body); color: var(--text); background: var(--bg);
  padding-bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased; overflow-wrap: anywhere;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-md); }
.i { width: 24px; height: 24px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.9;
     stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 18px; height: 18px; }
.i.xs { width: 15px; height: 15px; stroke-width: 2.2; }
.wrap { max-width: var(--content); margin: 0 auto; padding: 0 var(--gutter); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Masthead: white, red hamburger, round logo centred on an edge-to-edge hairline ---------- */
.masthead { position: relative; height: var(--masthead-h); --edge: max(var(--gutter), calc(50% - var(--content) / 2 + var(--gutter))); }
.masthead .rule { position: absolute; left: 0; right: 0; top: 50px; height: 1px; background: var(--rule-strong); }
.masthead .logo { position: absolute; left: 50%; top: 14px; width: 92px; margin-left: -46px; background: var(--bg); padding: 0 14px; }
.masthead .logo img { width: 64px; height: 64px; }
.masthead .burger { position: absolute; left: var(--edge); top: 14px; width: 32px; height: 26px;
  display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0; }
.masthead .burger span { display: block; height: 3px; border-radius: 2px; background: var(--accent); }
.masthead .action { position: absolute; right: var(--edge); top: 13px; color: var(--accent);
  font-weight: 700; font-size: 1.0625rem; letter-spacing: -0.015em; }
.masthead .under { position: absolute; top: 62px; display: flex; align-items: center; gap: 6px;
  font-size: 0.9375rem; color: var(--gray-700); max-width: 128px; white-space: nowrap; overflow: hidden; }
.masthead .under.left { left: var(--edge); color: var(--nav); font-weight: 700; letter-spacing: -0.02em; font-size: 1rem; }
.masthead .under.right { right: var(--edge); }
.masthead .under .i { color: var(--gray-600); }

/* ---------- Hero (the "Pretzel season is in session" pattern) ---------- */
.hero { padding: 22px 0 0; }
.eyebrow { font-size: 0.8125rem; font-weight: 700; text-transform: uppercase; letter-spacing: var(--track-eyebrow); color: var(--text-muted); }
.eyebrow.red { color: var(--red-700); }
.headline { color: var(--accent); font-weight: 700; font-size: var(--fs-h1); line-height: 1.06; letter-spacing: var(--track-tight); margin-top: 8px; }
.hero.compact .headline { font-size: var(--fs-h1-compact); line-height: 1.08; }
.lede { font-size: var(--fs-lede); line-height: 1.42; color: var(--text); margin-top: 12px; }
.lede strong { color: var(--text-strong); }
.triage { font-size: 1rem; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }
.triage b { color: var(--text-strong); }

/* ---------- Sections ---------- */
.sec { margin-top: 32px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-head h2 { font-size: var(--fs-h2); line-height: 1.15; font-weight: 700; color: var(--text-strong); letter-spacing: -0.025em;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec-head .more { color: var(--accent); font-weight: 700; font-size: 0.9375rem; white-space: nowrap; }
.sec-note { font-size: var(--fs-small); color: var(--text-muted); margin: -4px 0 12px; }
.lockline { display: flex; gap: 6px; align-items: center; color: var(--info); font-size: 0.8125rem; font-weight: 700; line-height: 1.3; }
.lockline .i { width: 16px; height: 16px; stroke-width: 2.2; flex: 0 0 auto; }

/* ---------- Cards + rows ---------- */
.card { display: block; background: var(--bg); border: 1px solid var(--rule); border-radius: var(--r-2xl); overflow: hidden;
  padding: 16px; margin-bottom: 12px; }
.card.list { padding: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px 13px 16px; min-height: 60px; }
.row + .row, .card > * + .row { border-top: 1px solid var(--rule); }
.row-main { flex: 1; min-width: 0; display: block; }
.row-title, .row-meta { display: block; }
.row-title { font-weight: 700; font-size: var(--fs-h3); line-height: 1.25; color: var(--text-strong); letter-spacing: -0.015em; }
.row-meta { font-size: var(--fs-small); color: var(--text-muted); margin-top: 3px; line-height: 1.35; }
.row-meta.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 5px; }
.row-meta b { color: var(--text); font-weight: 700; }
.row .chev { color: var(--nav); width: 22px; height: 22px; stroke-width: 2.2; }
.row .lead-ico { width: 40px; height: 40px; border-radius: var(--r-full); background: var(--tan-100);
  display: grid; place-items: center; color: var(--nav); flex: 0 0 auto; }
.row .lead-ico.red { background: var(--red-100); color: var(--red-700); }
.row .lead-ico.green { background: var(--ok-bg); color: var(--ok); }
.row .lead-ico.navy { background: var(--cool-white); color: var(--info); }
.row .lead-ico.gold { background: #FBF3DC; color: #8A6A1C; }
.row.compact { min-height: 52px; padding-top: 10px; padding-bottom: 10px; }
.due-red { color: var(--red-700); font-weight: 700; }
.todo-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--gray-400); background: #fff; flex: 0 0 auto; cursor: pointer; }
.av { width: 40px; height: 40px; border-radius: 50%; background: var(--tan-100); color: var(--nav); font-weight: 700; display: grid; place-items: center; flex: 0 0 auto; }

/* Feature card = the big rounded photo card from chick-fil-a.ca */
.feature { display: block; border-radius: var(--r-3xl); background: var(--tan-100); padding: 20px; position: relative; overflow: hidden; }
.feature.cream { background: var(--tan-050); border: 1px solid var(--tan-300); }
.feature.cool { background: var(--cool-white); }
.f-eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--red-700); }
.f-title { font-size: 1.375rem; line-height: 1.15; font-weight: 700; color: var(--text-strong); letter-spacing: -0.03em; margin-top: 6px; }
.f-body { font-size: 1rem; color: var(--text); margin-top: 6px; }

/* ---------- Badges + counts ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 700; line-height: 1;
  padding: 5px 9px; border-radius: var(--r-full); letter-spacing: 0; white-space: nowrap; vertical-align: middle; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-red { background: var(--red-100); color: var(--red-700); }
.b-green { background: var(--ok-bg); color: var(--ok); }
.b-navy { background: var(--cool-white); color: var(--info); box-shadow: inset 0 0 0 1px #CFE0E7; }
.b-tan { background: var(--tan-300); color: var(--tan-ink); }
.b-yellow { background: var(--yellow); color: var(--black-c); }
.count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-full);
  background: var(--accent); color: #fff; font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0; line-height: 1; }
/* On a red or navy fill, a count turns white so it never reads red-on-red */
.on .count, .btn-primary .count, .count.inv { background: #fff; color: var(--red-700); }

/* ---------- Progress ---------- */
.bar { display: block; height: 6px; border-radius: var(--r-full); background: var(--gray-100); overflow: hidden; margin-top: 10px; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.bar.navy > span { background: var(--info); }
.bar.done > span, .bar.green > span { background: var(--ok); }
.num { font-weight: 700; color: var(--text-strong); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; flex: 0 0 auto; overflow-wrap: normal; }
/* Rings: items LEFT in the centre. red = critical left · navy = in progress · green disc + tick = done */
.ring { width: 44px; height: 44px; flex: 0 0 auto; display: block; }
.ring .n { font: 700 15px var(--font-sans); letter-spacing: -0.02em; }
.ring .l { font: 700 7.5px var(--font-sans); letter-spacing: .06em; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 15rem; min-height: 48px;
  padding: 12px 24px; border-radius: var(--r-full); font-size: 0.875rem; font-weight: 700; letter-spacing: 0;
  cursor: pointer; border: 0; text-align: center; white-space: nowrap; }
.btn-primary { background: var(--red-grad); color: #fff; }
.btn-primary:active { background: var(--red-grad-pressed); }
.btn-secondary { background: #fff; color: var(--accent); box-shadow: inset 0 0 0 1px var(--gray-400); }
.btn-secondary:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.btn.sm { min-width: 0; min-height: 38px; padding: 8px 16px; }
.btn.block { width: 100%; }
.textlink { color: var(--accent); font-weight: 700; }

/* ---------- Tiles (chick-fil-a.ca menu-category cards) ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 14px; }
.tile { display: block; min-width: 0; }
.tile-art { aspect-ratio: 1 / 0.8; border-radius: var(--r-3xl); background: var(--bg-tile); display: grid; place-items: center; position: relative; }
.tile-art.cool { background: var(--cool-white); }
.tile-art svg { width: 72px; height: 72px; }
.tile-art .badge, .tile-art .count { position: absolute; top: 10px; right: 10px; }
.tile-name { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 10px;
  font-weight: 700; font-size: 1.0625rem; line-height: 1.2; color: var(--nav); letter-spacing: -0.02em; }
.tile-name .i { width: 18px; height: 18px; stroke-width: 2.4; }
.tile-meta { display: block; font-size: 0.8125rem; color: var(--text-muted); margin-top: 3px; }
/* Small tiles: the "Everything in Team Hub" strip at the foot of Today */
.tiles.small { grid-template-columns: repeat(3, 1fr); gap: 16px 10px; }
.tiles.small .tile-art { aspect-ratio: 1 / 0.82; border-radius: var(--r-2xl); }
.tiles.small .tile-art svg { width: 46px; height: 46px; }
.tiles.small .tile-art .count { top: 6px; right: 6px; }
.tiles.small .tile-name { font-size: 0.875rem; margin-top: 7px; letter-spacing: -0.015em; }
.tiles.small .tile-meta { font-size: 0.75rem; }

/* ---------- Segmented links (no JS: every segment is a plain link) ---------- */
.seg { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.seg a { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: var(--r-full);
  font-size: 0.875rem; font-weight: 700; color: var(--nav); box-shadow: inset 0 0 0 1px var(--gray-400); background: #fff; }
.seg a.on { background: var(--nav); color: #fff; box-shadow: none; }
.seg a .count { height: 18px; min-width: 18px; font-size: 0.6875rem; }
.seg.fit { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; padding: 3px; border-radius: var(--r-full);
  box-shadow: inset 0 0 0 1px var(--gray-400); }
.seg.fit a { box-shadow: none; background: transparent; justify-content: center; padding: 9px 0; }
.seg.fit a.on { background: var(--nav); color: #fff; }
.seg .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.seg a.on .live { background: #fff; }

/* ---------- Forms ---------- */
.field { display: block; font-weight: 700; font-size: 0.875rem; color: var(--text-strong); margin: 16px 0 6px; }
.input { width: 100%; height: 52px; border: 1px solid var(--gray-400); border-radius: var(--r-lg); padding: 0 14px;
  font-size: 1.0625rem; color: var(--text-strong); background: #fff; }
.input:focus { outline: 2px solid var(--info); outline-offset: 1px; border-color: var(--info); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9375rem; color: var(--text); margin-top: 16px; line-height: 1.35; }
.check .box { width: 22px; height: 22px; border: 2px solid var(--gray-400); border-radius: var(--r-md); flex: 0 0 auto; margin-top: 0; background: #fff; }
.check small { display: block; color: var(--text-muted); font-size: 0.8125rem; }
.search { display: flex; align-items: center; gap: 10px; height: 52px; border: 1px solid var(--gray-400);
  border-radius: var(--r-full); padding: 0 6px 0 16px; background: #fff; }
.search .i { color: var(--gray-600); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; font-size: 1rem; background: transparent; color: var(--text-strong); }
.search input::placeholder { color: var(--gray-600); }
.search button { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 0.9375rem; padding: 10px 12px; cursor: pointer; }

/* ---------- Callouts ---------- */
.callout { display: flex; gap: 10px; align-items: flex-start; background: var(--cool-white); color: var(--info);
  border-radius: var(--r-xl); padding: 12px 14px; font-size: 0.875rem; line-height: 1.4; }
.callout .i { width: 20px; height: 20px; }
.callout.tan { background: var(--tan-100); color: var(--tan-ink); }
.callout.warm { background: var(--red-050); color: var(--red-700); box-shadow: inset 0 0 0 1px var(--red-200); }

/* ---------- Bottom tab bar (phones) → top nav row (office desktop) ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.97);
  border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
.tabbar .tabs { max-width: var(--content); margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: var(--tabbar-h); }
.tabbar a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--nav); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0; }
.tabbar a .i { width: 24px; height: 24px; }
.tabbar a.on { color: var(--accent); }
.tabbar a.on::before { content: ""; position: absolute; top: -1px; left: 26%; right: 26%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tabbar a .count { position: absolute; top: 5px; left: calc(50% + 6px); height: 17px; min-width: 17px; font-size: 0.625rem; padding: 0 4px;
  box-shadow: 0 0 0 2px #fff; }
.tabbar a.on .count { background: var(--accent); color: #fff; }

/* ---------- Footer: fine print only (navigation lives in the tab bar + menu) ---------- */
.foot { margin-top: 40px; padding: 18px 0 4px; border-top: 1px solid var(--rule); font-size: 0.75rem; color: var(--text-muted);
  display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: center; }
.foot a { color: var(--gray-700); font-weight: 700; }

/* ---------- Office desktop (>= 960px): same pages, wider column, tabs become a top row ---------- */
@media (min-width: 960px) {
  :root { --content: var(--content-wide); --fs-h1: 2.75rem; --fs-h1-compact: 2.375rem; }
  body { padding-bottom: 32px; }
  .masthead .logo { top: 12px; width: 100px; margin-left: -50px; padding: 0 16px; }
  .masthead .logo img { width: 68px; height: 68px; }
  .tabbar { position: absolute; top: var(--masthead-h); bottom: auto; background: #fff; border-top: 0; border-bottom: 1px solid var(--rule); padding: 0; }
  .tabbar .tabs { height: 52px; grid-auto-columns: max-content; justify-content: center; gap: 40px; }
  .tabbar a { flex-direction: row; gap: 8px; font-size: 0.9375rem; letter-spacing: -0.01em; }
  .tabbar a .i { width: 20px; height: 20px; }
  .tabbar a.on::before { top: auto; bottom: -1px; left: 0; right: 0; border-radius: 3px 3px 0 0; }
  .tabbar a .count { position: static; box-shadow: none; }
  main.wrap { padding-top: 52px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .tiles.small { grid-template-columns: repeat(6, 1fr); gap: 20px; }
}

/* ---------- Main column + flash ---------- */
main.wrap { display: block; padding-bottom: 8px; }
.flash { background: var(--tan-100); color: var(--tan-ink); border-radius: var(--r-xl); padding: 12px 14px;
  font-size: 0.9375rem; line-height: 1.4; margin: 14px 0 0; }
.flash + .flash { margin-top: 8px; }
.banner-risk { background: var(--red-700); color: #fff; font-size: 0.8125rem; font-weight: 700; text-align: center; padding: 8px 16px; }

/* ---------- Legacy layer: the class names the rest of the pages already use ---------- */
h1.page { color: var(--accent); font-weight: 700; font-size: var(--fs-h1-compact); line-height: 1.08;
  letter-spacing: var(--track-tight); margin: 22px 0 6px; }
.sub { font-size: 1rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.4; }
.card h2 { font-size: var(--fs-h3); font-weight: 700; color: var(--text-strong); letter-spacing: -0.015em; margin-bottom: 8px; }
.card.tap h2 { color: var(--nav); }
.section-label { font-size: 0.8125rem; font-weight: 700; text-transform: uppercase; letter-spacing: var(--track-eyebrow);
  color: var(--red-700); margin: 26px 0 10px; }
.pill, button.pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px;
  padding: 9px 16px; border-radius: var(--r-full); background: #fff; color: var(--accent); border: 0;
  box-shadow: inset 0 0 0 1px var(--gray-400); font: inherit; font-size: 0.875rem; font-weight: 700; letter-spacing: 0;
  cursor: pointer; text-align: center; }
.pill:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.pill.primary { background: var(--red-grad); color: #fff; box-shadow: none; }
.pill.primary:active { background: var(--red-grad-pressed); }
.pill.small { min-height: 34px; padding: 6px 13px; font-size: 0.8125rem; }
.pill.ghost { background: transparent; }
.pill.on { background: var(--nav); color: #fff; box-shadow: none; }
.pillrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chiprow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chiprow::-webkit-scrollbar { display: none; }
.chiprow .pill { white-space: nowrap; flex: 0 0 auto; }
.bar.full > span { background: var(--ok); }
